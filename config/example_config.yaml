project:
  name: "WESworkflow"
  # Genome build expected by the workflow.
  # The current pipeline is configured for GRCh38 / hg38 resources.
  genome_build: "GRCh38"

environment:
  # Conda environment name recommended for running the workflow.
  conda_env: "wes-env"
  
  # Command used to run R scripts in a clean environment.
  # This avoids accidental use of user-level R libraries.
  r_clean_command: "R_LIBS= R_LIBS_USER= R_LIBS_SITE= R_PROFILE_USER=/dev/null Rscript --vanilla"

tools:
  # Docker image used for DeepVariant.
  # Use the GPU image if parameters.deepvariant_use_gpu is true.
  # Can be obtained from: https://github.com/google/deepvariant
  deepvariant_docker_image: "google/deepvariant:1.8.0-gpu"

  # Paths to Beagle-related JAR files used during genotype imputation.
  # Can be downloaded here: https://faculty.washington.edu/browning/beagle/beagle.html
  conform_gt_jar: "/path/to/conform-gt.jar"
  beagle_jar: "/path/to/beagle.jar"

  # Path to the ANNOVAR installation directory.
  # The workflow expects table_annovar.pl and humandb/ inside this directory.
  # https://annovar.openbioinformatics.org/en/latest/
  annovar_dir: "/path/to/annovar"


resources:
  # Reference genome FASTA file in GRCh38/hg38 build.
  # The file should be indexed for tools that require FASTA indexes.
  # http://feb2023.archive.ensembl.org/index.html
  reference_fasta: "/path/to/Homo_sapiens.GRCh38.dna.primary_assembly.fa"

  # Chain file used for BAM liftover from GRCh37/hg19 to GRCh38/hg38.  
  # Download: https://ftp.ensembl.org/pub/assembly_mapping/homo_sapiens/
  liftover_chain: "/path/to/GRCh37_to_GRCh38.chain.gz"

  # BED file with RefSeq exon and splice-region coordinates.
  # This path is relative to the repository root and can usually be left unchanged as the processed file is provided.
  refseq_bed: "Data/bed/refGene_exons_splice5.nochr.bed"
  
  # Directory with chromosome-specific Beagle genetic maps.
  # https://faculty.washington.edu/browning/beagle/beagle.html
  genetic_maps_dir: "/path/to/beagle/genetic_maps"

  # Directory with per-chromsosome reference panel.
  # This repository-relative example assumes that the EUR reference panel
  # was put in Data/reference_panel/EUR_nochr. 
  # Reference panel generated for this workflow is available at:
  # https://doi.org/10.5281/zenodo.19626919 
  reference_panel_dir: "Data/reference_panel/EUR_nochr"

  # Pre-scored CADD SNV file (corresponding .tbi index should be present next to it)
  # Download: https://cadd.bihealth.org/download
  cadd_prescored: "/path/to/CADD/whole_genome_SNVs.tsv.gz"



parameters:
  # Runtime settings should be adjusted to available computational resources.
  # threads: CPU threads per process; jobs: concurrently executed processes.
  # Ensure sufficient CPU, RAM, and storage bandwidth when running parallel jobs.
  
  # Default values reproduce the settings used in our computational
  # environment (48 physical cores and 96 logical CPUs, 503 GiB RAM, and
  # two NVIDIA RTX 6000 Ada GPUs with 49 GB VRAM each).

  # --- 1. Quality control and trimming ---
  trimmomatic_illuminaclip: "2:30:10"
  trimmomatic_slidingwindow: "4:20"
  trimmomatic_minlen: 45
  trimmomatic_trim_adapters: false
  trimmomatic_adapter_file: "TruSeq3-PE.fa"
  trimmomatic_threads: 8
  fastqc_threads: 24

  # --- 2. Alignment and liftover ---
  alignment_threads: 60
  bwa_min_score: 0
  mark_duplicates_jobs: 8

  # Expected FASTQ filename suffixes. Alternative is .fastq.gz for compressed files.
  fastq_r1_suffix: "_1.fastq"
  fastq_r2_suffix: "_2.fastq"
  liftover_threads: 24

  # --- 3. Variant calling and joint genotyping ---
  deepvariant_threads: 30
  # Requires a compatible DeepVariant Docker image.
  deepvariant_use_gpu: true
  bcftools_threads: 40

  # --- 4. Genotype imputation ---
  # Maximum 23 parallel chromosome jobs (autosomes and X).
  imputation_parallel_jobs: 23
  # Retain sites with at least one sample having ALT allelic depth > threshold.
  imputation_ad_threshold: 5
  beagle_threads: 10

  # --- 5. Variant annotation ---
  annotation_parallel_jobs: 23

  # --- 6. Gene-level feature generation ---
  feature_parallel_jobs: 23

  # --- 7. Gene-level analysis and imputation ---
  # Primary: CADD_weighted_avg_AF; alternative: CADD_weighted_cumulated_af.
  feature_column: "CADD_weighted_avg_AF"

  feature_imputation_workers: 48
  # Maximum size of exported future globals in GB.
  feature_imputation_future_max_size_gb: 4

  

directories:
  # --- FASTQ preprocessing and alignment ---
  raw_fastq: "/path/to/fastq"
  trimmed_fastq: "/path/to/trimmed_fastq_files"
  alignment_fastq: "/path/to/fastq_files"
  bam: "/path/to/aligned_bam_files"

  # --- BAM liftover ---
  hg19_bam: "/path/to/hg19_bam_files"
  lifted_bam: "/path/to/lifted_bam_files"

  # --- Variant calling and joint genotyping ---
  # Input BAM directory and suffix must match the selected processing route.
  deepvariant_bam: "/path/to/deepvariant_input_bam_files"
  # Common suffixes: "_marked.bam" (aligned) or ".sorted.bam" (lifted).
  deepvariant_bam_suffix: "_marked.bam"
  deepvariant_output: "/path/to/vcf_files/snv"

  # Parent directory searched recursively for GVCF files.
  gvcf_search_root: "/path/to/general/datasets/parent/directory"

  # --- Shared inputs and outputs ---
  # Main output directory for GLnexus and subsequent workflow stages.
  results_dir: "/path/to/results"

  # Sample metadata with the expected structure described in the example.
  sample_metadata: "/path/to/sample/metadata"

  # Temporary and scratch files.
  temporary_dir: "/path/to/tmp"
